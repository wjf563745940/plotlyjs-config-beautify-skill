<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Plotly.js 多图表解析演示</title>
    <script src="https://cdn.plot.ly/plotly-4.1.1.min.js" charset="utf-8"></script>
    <script src="skills/plotly-responsive/assets/plotly-responsive.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font: 14px/1.5 "Microsoft YaHei", sans-serif; margin: 16px; color: #374151; }
        .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
        button { padding: 4px 12px; cursor: pointer; }
        input[type="text"] { max-width: 100%; width: 170px; padding: 4px 8px; }
        .chart-card { border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px 12px; margin-bottom: 20px; min-width: 0; }
        .chart-card h4 { margin: 4px 0 8px; font-size: 14px; overflow-wrap: anywhere; }
        .chart-item { width: 100%; min-height: 400px; }
        .chart-error { padding: 12px; color: #b91c1c; }
        .diagnostics { font-size: 12px; color: #6b7280; }
        pre { max-height: 300px; overflow: auto; background: #f5f5f5; padding: 10px; }
        @media (max-width: 600px) {
            body { margin: 8px; }
            .chart-card { padding: 8px; }
        }
    </style>
</head>
<body>
    <h3>Plotly 多图表渲染 + 数据解析输出</h3>
    <div class="toolbar">
        <label>样例 <input type="text" id="mockInput" placeholder="mock3_point"></label>
        <button id="loadMock">加载样例</button>
        <button id="parseData">解析图表数据</button>
        <button id="updateData">更新图表数据</button>
        <label><input type="checkbox" id="fullDump"> 输出完整 data</label>
    </div>
    <div id="summary">加载中…</div>
    <div id="charts"></div>
    <pre id="output"></pre>
    <script>
        const records = [];
        const byDom = new WeakMap();
        const chartsRoot = document.getElementById('charts');
        const mockName = (new URLSearchParams(location.search).get('mock') || 'mock2').replace(/\.js$/i, '');
        document.getElementById('mockInput').value = mockName;

        document.getElementById('loadMock').onclick = () => {
            const name = document.getElementById('mockInput').value.trim().replace(/\.js$/i, '');
            if (!/^mock\d+(?:_[a-z0-9-]+)*$/i.test(name)) {
                document.getElementById('summary').textContent = '请输入样例名，例如 mock3_point。';
                return;
            }
            const url = new URL(location.href);
            url.searchParams.set('mock', name);
            location.href = url.href;
        };

        function loadFixture(name) {
            return new Promise((resolve, reject) => {
                if (!/^mock\d+(?:_[a-z0-9-]+)*$/i.test(name)) {
                    reject(new Error('无效的样例名'));
                    return;
                }
                const script = document.createElement('script');
                script.src = 'mocks/' + name + '.js';
                script.onload = resolve;
                script.onerror = () => reject(new Error('无法加载 mocks/' + name + '.js'));
                document.body.appendChild(script);
            });
        }

        function updateSummary() {
            const ready = records.filter(record => record.status === 'ready').length;
            const failed = records.filter(record => record.status === 'failed').length;
            document.getElementById('summary').textContent =
                mockName + '：共 ' + records.length + ' 个图表，已渲染 ' + ready + ' 个' + (failed ? '，失败 ' + failed + ' 个' : '') + '。';
        }

        function scheduleLabelCheck(record) {
            cancelAnimationFrame(record.labelFrame);
            record.labelFrame = requestAnimationFrame(() => PlotlyResponsive.resolveTextCollisions(record.dom));
        }

        function renderChart(record) {
            record.targetWidth = Math.round(record.dom.getBoundingClientRect().width);
            if (!record.targetWidth || record.targetWidth === record.renderedWidth ||
                record.targetWidth === record.failedWidth || record.running) return record.renderPromise;
            record.running = true;
            record.renderPromise = (async () => {
                do {
                    const width = record.targetWidth;
                    const fitted = PlotlyResponsive.fitFigure({
                        data: record.data, layout: record.sourceLayout, config: record.sourceConfig
                    }, width);
                    record.dom.style.height = fitted.height + 'px';
                    if (record.initialized) {
                        await Plotly.react(record.dom, fitted.data, fitted.layout, fitted.config);
                    } else {
                        await Plotly.newPlot(record.dom, fitted.data, fitted.layout, fitted.config);
                        record.initialized = true;
                        record.dom.on('plotly_afterplot', () => scheduleLabelCheck(record));
                        record.dom.on('plotly_buttonclicked', event => {
                            // Keep a menu's authored title as the source for later width changes.
                            const update = event.button && event.button.args && event.button.args[1];
                            if (!update || !update.title) return;
                            const text = typeof update.title === 'string' ? update.title : update.title.text;
                            const comparable = value => String(value || '').replace(/<br\s*\/?>|\s/gi, '');
                            const authored = (record.sourceLayout.updatemenus || []).flatMap(menu => menu.buttons || [])
                                .map(button => button.args && button.args[1] && button.args[1].title)
                                .find(title => comparable(typeof title === 'string' ? title : title && title.text) === comparable(text));
                            if (authored) record.sourceLayout.title = PlotlyResponsive.normalizeValue(authored);
                        });
                        record.dom.on('plotly_click', event => {
                            const point = event.points && event.points[0];
                            if (point) console.log('图表#' + (record.index + 1) + ' 点击的点：', point);
                        });
                    }
                    record.renderedWidth = width;
                    record.status = 'ready';
                    record.diagnostics.hidden = !fitted.warnings.length;
                    record.diagnostics.textContent = fitted.warnings.join(' ');
                    scheduleLabelCheck(record);
                    updateSummary();
                } while (record.targetWidth !== record.renderedWidth);
            })().catch(error => {
                record.status = 'failed';
                record.failedWidth = record.targetWidth;
                record.dom.classList.add('chart-error');
                record.dom.textContent = '图表#' + (record.index + 1) + ' 渲染失败：' + error.message;
                console.error(error);
                updateSummary();
            }).finally(() => { record.running = false; });
            return record.renderPromise;
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (const entry of entries) {
                const record = byDom.get(entry.target);
                if (record) renderChart(record);
            }
        });

        async function initialize() {
            await loadFixture(mockName);
            if (typeof Plotly === 'undefined') throw new Error('Plotly.js 未加载，请检查 CDN 连接。');
            const charts = Array.isArray(window.mockData) ? window.mockData : window.mockData ? [window.mockData] : [];
            for (const [index, item] of charts.entries()) {
                const card = document.createElement('div');
                card.className = 'chart-card';
                const heading = document.createElement('h4');
                const title = item.layout && item.layout.title;
                heading.textContent = '#' + (index + 1) + ' ' + (typeof title === 'string' ? title : title && title.text || '(无标题)');
                card.appendChild(heading);
                const dom = document.createElement('div');
                dom.className = 'chart-item';
                card.appendChild(dom);
                const diagnostics = document.createElement('p');
                diagnostics.className = 'diagnostics';
                diagnostics.hidden = true;
                card.appendChild(diagnostics);
                chartsRoot.appendChild(card);
                const record = {
                    index, dom, diagnostics, data: PlotlyResponsive.normalizeValue(item.data || []),
                    sourceLayout: PlotlyResponsive.normalizeValue(item.layout || {}), sourceConfig: item.config || {},
                    initialized: false, status: 'pending', running: false, renderPromise: Promise.resolve()
                };
                records.push(record);
                byDom.set(dom, record);
                renderChart(record);
                resizeObserver.observe(dom);
            }
            updateSummary();
            await Promise.all(records.map(record => record.renderPromise));
        }

        document.getElementById('parseData').onclick = () => {
            const full = document.getElementById('fullDump').checked;
            const result = records.map(record => {
                if (record.status !== 'ready') return { 序号: record.index + 1, 状态: record.status };
                const title = record.sourceLayout.title;
                const item = {
                    序号: record.index + 1,
                    轨迹数量: record.data.length,
                    图表标题: typeof title === 'string' ? title : title && title.text || '(无标题)',
                    轨迹列表: record.data.map((trace, index) => ({
                        索引: index, 类型: trace.type || 'scatter', 名称: trace.name || '',
                        X前3个: Array.isArray(trace.x) ? trace.x.slice(0, 3) : undefined,
                        Y前3个: Array.isArray(trace.y) ? trace.y.slice(0, 3) : undefined,
                        数据点数: Array.isArray(trace.y) ? trace.y.length : Array.isArray(trace.x) ? trace.x.length : undefined
                    }))
                };
                if (full) item.完整原始data = record.data;
                return item;
            });
            document.getElementById('output').textContent = JSON.stringify(result, null, 2);
        };

        document.getElementById('updateData').onclick = async () => {
            await Promise.all(records.map(async record => {
                await record.renderPromise;
                if (record.status !== 'ready') return;
                const indices = [];
                const values = [];
                record.data.forEach((trace, i) => {
                    if (!Array.isArray(trace.y) || !trace.y.length || !trace.y.every(value => typeof value === 'number')) return;
                    indices.push(i);
                    const next = trace.y.map(value => Number((value * (0.85 + Math.random() * 0.3)).toFixed(2)));
                    record.data[i].y = next;
                    values.push(next);
                });
                if (indices.length) await Plotly.restyle(record.dom, { y: values }, indices);
                scheduleLabelCheck(record);
            }));
        };

        window.plotlyDemoReady = initialize().catch(error => {
            document.getElementById('summary').textContent = error.message;
            console.error(error);
        });
    </script>
</body>
</html>
